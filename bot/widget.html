<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerger product advisor</title>
<style>
  :root{
    --blue:#00B9F2; --orange:#FF5B1E; --navy:#0B2942; --ink:#0B1B26;
    --line:#E2E9EE; --bg:#F4F7F9; --bot:#FFFFFF; --user:#00B9F2;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; align-items:stretch; justify-content:center;
  }
  .chat{
    display:flex; flex-direction:column; width:100%; max-width:520px;
    height:100%; background:#fff; border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  header{
    background:var(--navy); color:#fff; padding:16px 20px;
    display:flex; align-items:center; gap:12px; flex:0 0 auto;
  }
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
  header h1{
    font-family:Outfit,Inter,sans-serif; font-size:16px; font-weight:600;
    margin:0; letter-spacing:.2px;
  }
  header .sub{font-size:12px;opacity:.7;margin-top:2px;font-weight:400}
  header .bar{flex:1;min-width:0}
  #log{flex:1 1 auto; overflow-y:auto; padding:20px; display:flex;
    flex-direction:column; gap:14px; background:var(--bg)}
  .msg{max-width:85%; padding:11px 14px; border-radius:12px; font-size:14px;
    line-height:1.5; white-space:normal; word-wrap:break-word}
  .msg.bot{background:var(--bot); border:1px solid var(--line);
    border-radius:12px 12px 12px 4px; align-self:flex-start}
  .msg.user{background:var(--user); color:#fff;
    border-radius:12px 12px 4px 12px; align-self:flex-end}
  .msg a{color:var(--orange); font-weight:600; text-decoration:none;
    border-bottom:1px solid rgba(255,91,30,.35)}
  .msg.bot p{margin:0 0 8px} .msg.bot p:last-child{margin:0}
  .msg.bot ul{margin:6px 0;padding-left:18px} .msg.bot li{margin:2px 0}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;
    background:var(--bot);border:1px solid var(--line);border-radius:12px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#9db2c0;
    animation:b 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
  form{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);
    background:#fff;flex:0 0 auto}
  #q{flex:1;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
    font-size:14px;font-family:inherit;outline:none;color:var(--ink)}
  #q:focus{border-color:var(--blue)}
  button{background:var(--blue);color:#fff;border:0;border-radius:8px;
    padding:0 18px;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .hint{font-size:11px;color:#7d8f9b;text-align:center;padding:0 14px 10px;
    background:#fff}
  .handoff{background:#fff;border-top:1px solid var(--line);padding:8px 14px}
  .handoff-open{width:100%;background:none;border:0;color:var(--navy);
    font-size:12px;font-weight:600;cursor:pointer;padding:4px;text-align:center}
  .handoff-open:hover{color:var(--blue)}
  #handoff-form{display:none;flex-direction:column;gap:7px;padding-top:4px}
  #handoff-form.show{display:flex}
  #handoff-form input,#handoff-form textarea{border:1px solid var(--line);
    border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;
    outline:none;color:var(--ink)}
  #handoff-form input:focus,#handoff-form textarea:focus{border-color:var(--blue)}
  #handoff-form textarea{resize:vertical;min-height:38px}
  .handoff-row{display:flex;gap:7px}
  .handoff-row button{flex:0 0 auto;padding:0 14px}
  .handoff-cancel{background:#fff !important;color:#7d8f9b !important;
    border:1px solid var(--line) !important}
  .handoff-note{font-size:11px;color:#7d8f9b;text-align:center}
</style>
</head>
<body>
<div class="chat">
  <header>
    <span class="dot"></span>
    <div class="bar">
      <h1>Kerger product advisor</h1>
      <div class="sub">Marine &amp; offshore electrotechnical supplies</div>
    </div>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="q" autocomplete="off"
           placeholder="Ask about a product, code or application…">
    <button id="send" type="submit">Send</button>
  </form>
  <div class="handoff">
    <button type="button" class="handoff-open" id="handoff-open">
      ✉ Send this chat to Kerger for a personal follow-up
    </button>
    <form id="handoff-form">
      <input id="h-name" placeholder="Your name" autocomplete="name">
      <input id="h-email" type="email" placeholder="Your email" autocomplete="email">
      <textarea id="h-note" placeholder="Anything to add? (optional)"></textarea>
      <div class="handoff-row">
        <button type="submit" id="h-send" style="flex:1">Send to Kerger</button>
        <button type="button" class="handoff-cancel" id="h-cancel">Cancel</button>
      </div>
      <div class="handoff-note">Your conversation and contact details go to our
        sales team, who will reply by email.</div>
    </form>
  </div>
  <div class="hint">Prices are personal — log in to your account to see yours.</div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');

// Persist the conversation so it follows the visitor across page navigations
// (the iframe reloads on each page). sessionStorage keeps it for the browser
// session; a TTL guards against resurrecting a very old chat.
const STORE_KEY = 'kerger_chat';
const STORE_TTL = 2 * 3600 * 1000;   // 2 hours
let state = {sid: '', ts: 0, msgs: []};
try {
  const raw = sessionStorage.getItem(STORE_KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.msgs) && (Date.now() - (s.ts || 0)) < STORE_TTL)
      state = s;
  }
} catch (e) {}
let sessionId = state.sid || '';

function persist(){
  state.sid = sessionId; state.ts = Date.now();
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}

// Minimal, safe Markdown: escape everything, then re-enable [text](url) links
// and **bold**. No raw HTML from the model is ever inserted.
function render(text){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
                     .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const lines = text.split('\n');
  let html = '', inList = false;
  const inline = s => esc(s)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      (m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  for(let raw of lines){
    const line = raw.trim();
    const li = line.match(/^[-*]\s+(.*)/);
    if(li){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${inline(li[1])}</li>`; continue; }
    if(inList){html+='</ul>';inList=false;}
    if(line) html += `<p>${inline(line)}</p>`;
  }
  if(inList) html+='</ul>';
  return html;
}

function draw(role, text){
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = role === 'bot' ? render(text) : text.replace(/</g,'&lt;');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function add(role, text){
  state.msgs.push({role, text}); persist();
  return draw(role, text);
}

function typing(on){
  let t = document.getElementById('typing');
  if(on && !t){
    t = document.createElement('div'); t.id='typing'; t.className='typing';
    t.innerHTML='<span></span><span></span><span></span>';
    log.appendChild(t); log.scrollTop = log.scrollHeight;
  } else if(!on && t){ t.remove(); }
}

const WELCOME = "Welcome,\n\n"
  + "I can help you find the right Kerger product — tell me what you're looking "
  + "for, or give me a Kerger number, IMPA/ISSA code or manufacturer type. "
  + "I can help finding the product or offering an alternative. "
  + "You may use your preferred language.";
if (state.msgs.length) {
  state.msgs.forEach(m => draw(m.role, m.text));   // replay prior conversation
} else {
  add('bot', WELCOME);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const msg = input.value.trim();
  if(!msg) return;
  add('user', msg);
  input.value=''; input.disabled=true; send.disabled=true;
  typing(true);
  try{
    const res = await fetch('/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sessionId, message: msg})
    });
    const data = await res.json();
    typing(false);
    if(data.session_id){ sessionId = data.session_id; persist(); }
    add('bot', data.reply || data.error || 'Sorry, something went wrong.');
  }catch(err){
    typing(false);
    add('bot', 'Sorry, I could not reach the advisor. Please try again.');
  }
  input.disabled=false; send.disabled=false; input.focus();
});
input.focus();

// --- Send to Kerger (livechat operator inbox) ---
const hOpen = document.getElementById('handoff-open');
const hForm = document.getElementById('handoff-form');
const hCancel = document.getElementById('h-cancel');
const hSend = document.getElementById('h-send');

hOpen.addEventListener('click', ()=>{
  hForm.classList.add('show'); hOpen.style.display='none';
  document.getElementById('h-name').focus();
});
hCancel.addEventListener('click', ()=>{
  hForm.classList.remove('show'); hOpen.style.display='';
});
hForm.addEventListener('submit', async e=>{
  e.preventDefault();
  const name = document.getElementById('h-name').value.trim();
  const email = document.getElementById('h-email').value.trim();
  const note = document.getElementById('h-note').value.trim();
  if(!email){ document.getElementById('h-email').focus(); return; }
  hSend.disabled=true; hSend.textContent='Sending…';
  try{
    const res = await fetch('/lead', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sessionId, name, email, note})
    });
    const data = await res.json();
    hForm.classList.remove('show'); hOpen.style.display='';
    hSend.disabled=false; hSend.textContent='Send to Kerger';
    hForm.reset();
    add('bot', data.ok
      ? "Thank you — I've sent this conversation to the Kerger sales team. "
        + "They'll get back to you by email shortly."
      : (data.error || "Sorry, I couldn't send that just now. Please try again."));
  }catch(err){
    hSend.disabled=false; hSend.textContent='Send to Kerger';
    add('bot', "Sorry, I couldn't reach Kerger just now. Please try again.");
  }
});
</script>
</body>
</html>
